name = "arti-viewer"
main = "viewer.js"
compatibility_date = "2026-07-01"
preview_urls = false

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

# Serves the viewer at https://<your-route>/viewer
# Add a route once you know the hostname, e.g.:
# routes = [
#   { pattern = "internal.arti.example/viewer*", zone_name = "arti.example" }
# ]

[[r2_buckets]]
binding = "ARTI_INPUT"
bucket_name = "arti-input"

[[r2_buckets]]
binding = "ARTI_MODELS"
bucket_name = "arti-models"

[[r2_buckets]]
binding = "ARTI_OUTPUT"
bucket_name = "arti-output"
