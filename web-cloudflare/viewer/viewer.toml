name = "view"
main = "viewer.js"
compatibility_date = "2026-07-01"
preview_urls = false

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

# Served at the workers.dev subdomain: https://view.arti2.workers.dev
# To serve on a custom zone instead, add a route, e.g.:
# routes = [
#   { pattern = "internal.arti.example/*", zone_name = "arti.example" }
# ]

[[r2_buckets]]
binding = "ARTI_INPUT"
bucket_name = "arti-input"

[[r2_buckets]]
binding = "ARTI_MODELS"
bucket_name = "arti-models"

[[r2_buckets]]
binding = "ARTI_OUTPUT"
bucket_name = "arti-output"

# AUDIO_SIGN_SECRET is required for /api/sign-audio-urls and signed /file
# links (report downloads) to work - it's a secret, not set here. Provision
# it once with:
#   wrangler secret put AUDIO_SIGN_SECRET -c viewer.toml
